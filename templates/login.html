<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 记账机器人SaaS平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .login-title i {
            font-size: 3rem;
            color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-title">
            <i class="bi bi-robot"></i>
            <h3 class="mt-3">记账机器人SaaS</h3>
            <p class="text-muted">管理后台登录</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <div class="alert alert-danger d-none" id="error-message"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-login">登录</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">没有账号？请在Telegram中联系机器人</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            errorDiv.classList.add('d-none');

            try {
                const response = await axios.post('/api/auth/login', {
                    username: username,
                    password: password
                });

                // 保存token
                localStorage.setItem('access_token', response.data.access_token);

                // 跳转到控制台
                window.location.href = '/dashboard';
            } catch (error) {
                errorDiv.textContent = error.response?.data?.detail || '登录失败';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
